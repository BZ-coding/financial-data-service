admin:
  enabled: true
  page_title: Market Data Service Admin
api:
  host: 0.0.0.0
  port: 8084
  reload: false
  workers: 1
collectors:
  akshare:
    enabled: true
    rate_limit_per_minute: 30
    retry_attempts: 3
    retry_backoff_factor: 2
    timeout_seconds: 30
    # estimate_nav（盘中估算净值）信源顺序，按序尝试，第一个成功即用。
    # 2026-10-26 背景：东方财富已下线盘中估值服务 ——
    #   fundgz.1234567.com.cn/js/<code>.js 返回 404 页面但 HTTP 状态码 200
    #   akshare 自带的 api.fund.eastmoney.com/FundGuZhi 也返回 {"Data":null}
    # → 原本每天白跑 504 次失败。现改用新浪（实测可用，数据与历史 nav_data 交叉验证一致）。
    #   sina_fu : 新浪 fu_ 行情（盘中估算净值，semantic=intraday_estimate）
    #   sina_of : 新浪 of_ 行情（确认收盘净值，semantic=confirmed_close）—— 债券基金等 fu_ 无数据时兜底
    #   fundgz  : 东方财富 fundgz（已下线，保留以便对方恢复时切回）
    estimate_nav_sources:
      - sina_fu
      - sina_of
      - fundgz
  rss:
    enabled: true
    rate_limit_per_second: 1
    timeout_seconds: 15

  massive:
    enabled: true
    api_key: "6Hkk3xTJy7EMATDicfsis0G9EvnC5AiV"
    rate_limit_per_minute: 30
    timeout_seconds: 30
  tickflow:
    enabled: true
    api_key: "tk_f8ca8eef098d44b7b7e870928446fd84"
    rate_limit_per_minute: 30
    timeout_seconds: 30
  tushare:
    enabled: true
    token: "2abb9fd96ba5d57e79650ab02f25cdb4148c43b57611bc7e7a150c69"
    rate_limit_per_minute: 60
    timeout_seconds: 30
  zhihu:
    enabled: true
    rate_limit_per_minute: 30
    timeout_seconds: 30
    default_search_queries:
      - 易方达蓝筹精选
      - 中欧医疗健康
      - 金风科技 002202
      - 半导体 国产替代 2026
      - 美联储 降息
    default_global_queries:
      - A股 今日行情
      - 新基金发行 2026
      - 新能源 政策
database:
  busy_timeout: 5000
  journal_mode: WAL
  path: /home/zsd/financial-data-service/market_service/data/market.db
  wal_mode: true
logging:
  directory: logs
  level: INFO
  max_files: 10
  max_size_mb: 10
retention:
  announcement_days: 90
  cleanup_hour: 2
  news_days: 30
  price_days: 60
scheduler:
  batch_size: 20
  check_interval_seconds: 60
