name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          set -e
          LEAKS=0
          if git ls-files | grep -E '(^|/)\.env$|credentials|\.pem$|\.key$|\.keystore$'; then
            echo "::error::credential-like file tracked in git"; LEAKS=1
          fi
          PATTERNS=(
            'sk-[A-Za-z0-9]{20,}'
            'api[_-]?key["'"'"' ]*[=:][ ]*["'"'"'][A-Za-z0-9_-]{16,}'
            'token["'"'"' ]*[=:][ ]*["'"'"'][A-Za-z0-9_-]{20,}'
            'BEGIN (RSA |EC )?PRIVATE KEY'
            'AKIA[0-9A-Z]{16}'
            'ghp_[A-Za-z0-9]{36}'
            'gho_[A-Za-z0-9]{36}'
            'ghs_[A-Za-z0-9]{36}'
            'xox[bp]-[A-Za-z0-9-]{10,}'
            'freellmapi-[A-Za-z0-9]{20,}'
          )
          for pat in "${PATTERNS[@]}"; do
            if git grep -I -n -E "$pat" -- . ':!*.example' ':!market_service/config.yaml' ':!market_service/config/config.yaml'; then
              echo "::error::possible secret matching $pat"; LEAKS=1
            fi
          done
          exit $LEAKS
