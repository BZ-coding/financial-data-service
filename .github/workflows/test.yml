name: financial-data-service tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: market_service/requirements.txt

      - name: Install deps (full — smoke test imports market_service.api which transitively imports akshare via scheduler)
        run: |
          python -m pip install --upgrade pip
          pip install -r market_service/requirements.txt
          pip install pytest httpx

      - name: Pin fastapi/starlette for TestClient(app) compatibility
        run: |
          pip install 'fastapi==0.110.0' 'starlette==0.36.3' 'httpx==0.27.2'
          python -c "from fastapi.testclient import TestClient; from fastapi import FastAPI; TestClient(FastAPI()); print('TestClient OK')"

      - name: Install fin-indicators (shared library repo)
        run: |
          git clone --depth 1 https://github.com/BZ-coding/fin-indicators.git /tmp/fin-indicators
          pip install /tmp/fin-indicators

      - name: Import smoke test
        run: |
          python -c "import market_service; from market_service import api, database; print('imports OK')"
          python -c "from market_service.api import app; print('app loadable:', type(app).__name__)"

      - name: Check script syntax (api.py, database.py, run.py, run_server_8084.py)
        run: |
          python -m py_compile market_service/api.py market_service/database.py market_service/run.py market_service/run_server_8084.py && echo "syntax OK"

      - name: Pytest (eastmoney fields regression — 纯函数，不依赖本地库)
        run: |
          python -m pytest tests/test_eastmoney_fields.py -v --tb=short